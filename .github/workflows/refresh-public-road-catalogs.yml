name: Refresh public road catalogs

on:
  schedule:
    # Monday and Thursday at 02:17 UTC.
    - cron: "17 2 * * 1,4"
  workflow_dispatch:
  pull_request:

concurrency:
  group: public-road-catalog-${{ github.event.pull_request.number || 'refresh' }}
  cancel-in-progress: false

# Unspecified permissions are denied; each job grants only what it needs.
permissions: {}

defaults:
  run:
    shell: bash

env:
  LC_ALL: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  TZ: UTC

jobs:
  preflight:
    name: Read-only pull request preflight
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the PR merge commit without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12.12"

      - name: Run offline parser and schema preflight
        run: |
          set -euo pipefail
          python3 tests/tender_source_registry_test.py
          python3 tests/tender_scope_test.py
          python3 tests/national_highway_contracts_test.py
          python3 tests/gepnic_tender_crawler_test.py
          python3 tests/gepnic_road_notice_pack_builder_test.py
          python3 tests/bihar_road_tender_puller_test.py
          python3 tests/chhattisgarh_chips_road_tender_puller_test.py
          python3 tests/gujarat_nprocure_road_tender_puller_test.py
          python3 tests/lakshadweep_road_tender_puller_test.py
          python3 tests/telangana_road_tender_puller_test.py
          python3 tests/andhra_pradesh_road_tender_source_test.py
          python3 tests/kppp_road_award_puller_test.py
          python3 tests/emarg_road_contract_puller_test.py
          python3 tests/pmgsy_road_agreement_puller_test.py
          python3 tests/pmgsy_road_agreement_pack_builder_test.py
          python3 tests/catalog_pack_pruner_test.py

          python3 tests/sec007_workflow_security_test.py

  refresh:
    name: Read-only refresh and validation
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.transfer.outputs.changed }}
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          # Pruning must preserve packs referenced by historical release tags.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12.12"

      - name: Run offline parser and schema preflight
        run: |
          set -euo pipefail
          python3 tests/tender_source_registry_test.py
          python3 tests/tender_scope_test.py
          python3 tests/national_highway_contracts_test.py
          python3 tests/gepnic_tender_crawler_test.py
          python3 tests/gepnic_road_notice_pack_builder_test.py
          python3 tests/bihar_road_tender_puller_test.py
          python3 tests/chhattisgarh_chips_road_tender_puller_test.py
          python3 tests/gujarat_nprocure_road_tender_puller_test.py
          python3 tests/lakshadweep_road_tender_puller_test.py
          python3 tests/telangana_road_tender_puller_test.py
          python3 tests/andhra_pradesh_road_tender_source_test.py
          python3 tests/kppp_road_award_puller_test.py
          python3 tests/emarg_road_contract_puller_test.py
          python3 tests/pmgsy_road_agreement_puller_test.py
          python3 tests/pmgsy_road_agreement_pack_builder_test.py
          python3 tests/catalog_pack_pruner_test.py

          python3 tests/sec007_workflow_security_test.py

      - name: Install locked browser tooling for the public Gujarat tender table
        run: |
          set -euo pipefail
          python3 -m pip install --require-hashes --only-binary=:all: \
            -r .github/catalog-refresh-requirements.txt
          # The wheel pins Chromium headless shell revision 1208. Runner image
          # supplies OS libraries; do not run a mutable apt install as root.
          python3 -m playwright install --only-shell chromium
          python3 -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(headless=True); b.close(); p.stop()'

      - name: Refresh official source snapshots
        run: |
          set -euo pipefail
          catalog_retrieved_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          python3 tools/pull-national-highway-contracts.py \
            --retrieved-at "$catalog_retrieved_at" \
            --pretty

          mkdir -p \
            data/gepnic-road-notices/sources \
            data/gepnic-road-notices/states \
            data/custom-road-tenders/br \
            data/custom-road-tenders/cg \
            data/custom-road-tenders/gj \
            data/custom-road-tenders/ld \
            data/custom-road-tenders/tg \
            data/pmgsy-road-agreements/sources
          find data/gepnic-road-notices/sources -type f -name '*.json' -delete
          find data/gepnic-road-notices/states -type f -name '*.json' -delete
          python3 tools/pull-india-gepnic.py \
            --output-dir data/gepnic-road-notices \
            --retrieved-at "$catalog_retrieved_at" \
            --timeout 45 \
            --request-delay 0.20
          # Source receipts plus the crawl report are the canonical inputs. The per-State
          # files duplicate every retained notice and are not used by the pack builder.
          find data/gepnic-road-notices/states -type f -name '*.json' -delete

          python3 tools/pull-bihar-road-tenders.py \
            --output data/custom-road-tenders/br/in-br-eproc2.json \
            --as-of "$catalog_retrieved_at" \
            --timeout 120
          python3 tools/pull-chhattisgarh-chips-road-tenders.py \
            --output data/custom-road-tenders/cg/in-ct-chips.json \
            --as-of "$catalog_retrieved_at" \
            --timeout 120
          python3 tools/pull-gujarat-nprocure-road-tenders.py \
            --output data/custom-road-tenders/gj/in-gj-nprocure.json \
            --as-of "$catalog_retrieved_at" \
            --timeout 120
          python3 tools/pull-lakshadweep-road-tenders.py \
            --output data/custom-road-tenders/ld/in-ld-official-tender-notices.json \
            --as-of "$catalog_retrieved_at" \
            --timeout 120
          python3 tools/pull-telangana-road-tenders.py \
            --output data/custom-road-tenders/tg/in-tg-eprocurement.json \
            --as-of "$catalog_retrieved_at" \
            --timeout 120

          find data/pmgsy-road-agreements/sources -type f -name '*.json.gz' -delete
          python3 tools/pull-pmgsy-road-agreements.py \
            --all-states \
            --output-dir data/pmgsy-road-agreements/sources \
            --as-of "$catalog_retrieved_at" \
            --timeout 120

      - name: Rebuild immutable runtime packs and manifests
        run: |
          set -euo pipefail
          python3 tools/build-highway-contract-packs.py
          python3 tools/build-gepnic-road-notice-packs.py
          python3 tools/build-pmgsy-road-agreement-packs.py
          python3 tools/prune-catalog-packs.py --apply

      - name: Verify generated catalogs without a browser
        run: |
          set -euo pipefail
          python3 tools/build-highway-contract-packs.py --check
          python3 tools/build-gepnic-road-notice-packs.py --check
          python3 tools/build-pmgsy-road-agreement-packs.py --check
          python3 tools/prune-catalog-packs.py --check
          python3 tests/tender_contract_pack_builder_test.py
          python3 tests/gepnic_road_notice_pack_builder_test.py
          python3 tests/pmgsy_road_agreement_pack_builder_test.py

      - name: Enforce catalog-only changes and record transfer provenance
        id: transfer
        run: |
          set -euo pipefail
          python3 .github/scripts/catalog-transfer.py capture "$RUNNER_TEMP/catalog-transfer"

      - name: Upload validated catalog data from this run
        if: steps.transfer.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-road-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-transfer/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish catalog data for review on a fresh runner
    needs: refresh
    if: ${{ needs.refresh.result == 'success' && needs.refresh.outputs.changed == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12.12"

      - name: Download only this run's catalog transfer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public-road-catalog-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/catalog-transfer/

      - name: Validate and stage data without executing artifact content
        run: |
          set -euo pipefail
          python3 .github/scripts/catalog-transfer.py apply "$RUNNER_TEMP/catalog-transfer"

      - name: Commit, push the automation branch, and open a review PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub supplies numeric run identifiers, not dispatch/PR shell inputs.
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          catalog_branch="automation/public-road-catalogs-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -c core.hooksPath=/dev/null switch -c "$catalog_branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null diff --cached --check
          git -c core.hooksPath=/dev/null commit -m "Refresh public road catalogs"
          # Keep the token out of remotes and persistent Git configuration.
          # The HTTP authorization header exists only in this process environment.
          catalog_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          echo "::add-mask::$catalog_auth"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $catalog_auth" \
            git -c core.hooksPath=/dev/null push --set-upstream origin "$catalog_branch"
          unset catalog_auth
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$catalog_branch" \
            --title "Refresh public road catalogs" \
            --body "Automated refresh from the official NHAI/MoRTH, NHIDCL, State/UT procurement, and PMGSY public feeds.

          The read-only refresh job rebuilt and schema-checked the content-addressed highway-contract, road-notice, and road-agreement packs. The publication job verified catalog-only paths, file hashes, and provenance for source commit $GITHUB_SHA in run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT. Review the source receipts, record-count changes, and manifest diffs before merging.

          This automation never pushes to or merges main."
